<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
</head>
<body>
  <div>
    <div class="languages">
      <!-- 1-й рядок: смужки + заголовок -->
      <div class="row align-items-center">
        <div class="col-4">
          <div class="line"></div>
        </div>
        <div class="col-4 text-center">
          <div class="title-box">
            <span class="v-line d-flex justify-content-start"></span>
            <h2 class="text-15">Languages</h2>
            <span class="v-line d-flex justify-content-end"></span>
          </div>
        </div>
        <div class="col-4">
          <div class="line"></div>
        </div>

      </div>
      <br>
      <br>
      <!-- 2-й рядок: мови -->
      <div class="row">
        <div class="col-4">
          <div class="language-2">
            <span>English</span>
            <div class="bar"><div class="fill" style="width:90%;"></div></div>
          </div>
          <div class="language-2">
            <span>Spanish</span>
            <div class="bar"><div class="fill" style="width:75%;"></div></div>
          </div>
        </div>
        <div class="col-4">
          <div class="language">
            <span>French</span>
            <div class="bar"><div class="fill" style="width:50%;"></div></div>
          </div>
          <div class="language">
            <span>German</span>
            <div class="bar"><div class="fill" style="width:70%;"></div></div>
          </div>
        </div>
        <div class="col-4">
          <div class="language-3">
            <span>Japanese</span>
            <div class="bar"><div class="fill" style="width:40%;"></div></div>
          </div>
          <div class="language-3">
            <span>Portuguese</span>
            <div class="bar"><div class="fill" style="width:55%;"></div></div>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
